{
  "name": "aarovia-crm-backend",
  "services": [
    {
      "type": "web",
      "name": "backend",
      "plan": "free",
      "runtime": "node",
      "buildCommand": "npm install && npm run build && npx prisma generate && npx prisma db push --skip-generate",
      "startCommand": "node dist/index.js",
      "envVars": [
        {
          "key": "NODE_ENV",
          "value": "production"
        },
        {
          "key": "PORT",
          "value": "5000"
        },
        {
          "key": "DATABASE_URL",
          "fromDatabase": {
            "name": "aarovia_db",
            "property": "connectionString"
          }
        },
        {
          "key": "JWT_SECRET",
          "generateValue": true
        },
        {
          "key": "FRONTEND_URL",
          "value": "https://your-frontend.vercel.app"
        }
      ]
    },
    {
      "type": "pserv",
      "name": "aarovia_db",
      "plan": "free",
      "ipAllowList": [],
      "postgresMajorVersion": 15
    }
  ]
}
